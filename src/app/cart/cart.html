<div
  class="w-full rounded-2xl border border-gray-200 bg-white p-5 max-h-[30vh] overflow-y-auto pr-2 scrollbar-thin"
>
  <div class="mb-5 flex items-center justify-between">
    <h3 class="text-lg font-bold text-gray-900">Food Cart</h3>

    <span
      *ngIf="cart.length > 0"
      class="rounded-full bg-gray-100 px-3 py-1 text-xs font-medium text-gray-600"
    >
      {{ cart.length }} items
    </span>
  </div>

  <p
    *ngIf="cart.length === 0"
    class="rounded-xl bg-gray-50 py-10 text-center text-sm text-gray-400"
  >
    Tap a menu item to add it here.
  </p>

  <div
    *ngFor="let line of cart"
    class="flex items-center gap-3 border-b border-gray-100 py-3 last:border-0"
  >
    <div class="h-12 w-12 shrink-0 overflow-hidden rounded-xl bg-gray-100">
      <img [src]="line.item.image" [alt]="line.item.name" class="h-full w-full object-cover" />
    </div>

    <div class="min-w-0 flex-1">
      <p class="truncate text-sm font-semibold text-gray-900">
        {{ line.item.name }}
      </p>

      <p class="mt-1 text-xs text-gray-400">৳ {{ line.item.price.toFixed(2) }}</p>
    </div>

    <div class="flex items-center rounded-lg border border-gray-200">
      <button
        type="button"
        (click)="decreaseQty(line)"
        class="flex h-8 w-8 cursor-pointer items-center justify-center text-lg text-gray-600 transition hover:bg-gray-100"
      >
        −
      </button>

      <span class="w-8 text-center text-sm font-semibold">
        {{ line.quantity }}
      </span>

      <button
        type="button"
        (click)="increaseQty(line)"
        class="flex h-8 w-8 cursor-pointer items-center justify-center text-lg text-gray-600 transition hover:bg-gray-100"
      >
        +
      </button>
    </div>

    <div class="w-20 text-right text-sm font-bold text-gray-900">
      ৳ {{ (line.item.price * line.quantity).toFixed(2) }}
    </div>
  </div>
</div>
