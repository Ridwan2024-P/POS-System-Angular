<div class="div">
<hlm-card class="w-full max-w-sm">
			<hlm-card-header>
				<h3 class=" text-lg font-bold text-gray-900">Login to your account</h3>
			</hlm-card-header>

			<div hlmCardContent>
				<form id="login-form" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
					<div class="flex flex-col gap-6">
						<div class="grid gap-2">
							<label class="mb-2" for="email">Email</label>
							<input type="email" id="email" placeholder="m@example.com" required  formControlName="email" class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm outline-none transition focus:border-gray-900 focus:bg-white"  />
						</div>

						<div class="grid gap-2">
							<div class="flex items-center">
								<label hlmLabel for="password">Password</label>
								
							</div>
							<input type="password" id="password"  formControlName="password"  class="w-full rounded-lg border border-gray-200 bg-gray-50 px-3 py-2.5 text-sm outline-none transition focus:border-gray-900 focus:bg-white"/>
						</div>
					</div>
				</form>
			</div>

			<hlm-card-footer class="flex-col gap-2">
				<button  type="submit" class="w-full rounded-lg border px-4 py-2.5 text-sm font-medium bg-black text-white" form="login-form">Login</button>
			</hlm-card-footer>
		</hlm-card>
        
</div>
