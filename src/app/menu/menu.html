<div
  class="left rounded-2xl p-5 border border-gray-100 max-h-[100vh] overflow-y-auto pr-2 scrollbar-thin"
>
  <div class="w-full">
    <div
      class="flex w-full items-center rounded-full border border-gray-200 bg-gray-100 px-4 py-2 mb-5"
    >
      <span class="mr-2 text-xl text-gray-500">⌕</span>

      <input
        type="text"
        placeholder="Search food..."
        [(ngModel)]="searchText"
        class="min-w-0 flex-1 bg-transparent outline-none"
      />
    </div>
  </div>

  <div class="flex flex-wrap gap-3 mb-6">
    <button
      *ngFor="let cat of categories"
      type="button"
      class="rounded-full border cursor-pointer border-gray-200 bg-white px-5 py-2 text-sm font-medium text-gray-600 transition-all duration-200 hover:bg-black hover:text-white hover:border-black"
      [class.bg-black]="selectedCategory === cat"
      [class.border-gray-900]="selectedCategory === cat"
      (click)="selectedCategory = cat"
    >
      {{ cat }}
    </button>
  </div>

  <div
    *ngIf="filteredMenuItems.length === 0"
    class="flex min-h-[300px] flex-col items-center justify-center text-center"
  >
    <div class="mb-4 flex h-12 w-12 items-center justify-center rounded-full bg-gray-100 text-3xl">
      <span class="text-2xl text-gray-400">⌕</span>
    </div>

    <h3 class="text-lg font-semibold text-gray-800">Not Available</h3>

    <p class="mt-1 text-sm text-gray-500">No food found for your search.</p>
  </div>

  <div
    *ngIf="filteredMenuItems.length > 0"
    class="grid grid-cols-2 gap-4 sm:grid-cols-3 lg:grid-cols-4"
  >
    <button
      *ngFor="let item of filteredMenuItems"
      type="button"
      (click)="addToCart(item)"
      class="group rounded-2xl cursor-pointer border border-gray-200 bg-white p-4 text-left duration-200 hover:border-gray-300 hover:shadow-lg"
    >
      <div
        class="mb-3 flex h-28 w-full items-center justify-center overflow-hidden rounded-xl bg-gray-100 text-3xl font-bold text-gray-500 transition group-hover:bg-gray-900 group-hover:text-white"
      >
        <img [src]="item.image" [alt]="item.name" class="h-28 w-full rounded-xl object-cover" />
      </div>

      <div class="mb-1 truncate text-sm font-semibold text-gray-900">
        {{ item.name }}
      </div>

      <div class="text-base font-bold text-gray-700">৳ {{ item.price.toFixed(2) }}</div>
    </button>
  </div>
</div>
