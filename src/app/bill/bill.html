  <div class="bill-details mt-5">
              <div class="w-full rounded-2xl border border-gray-200 bg-white p-5">
                <h3 class="mb-5 text-lg font-bold text-gray-900">Bill</h3>
                @if (errorMessage) {
                  <hlm-alert class="border-red-200 bg-red-50 text-red-900 mb-3">
                    <ng-icon name="lucideAlertTriangle" />

                    <h4 hlmAlertTitle>Required Information</h4>

                    <p hlmAlertDescription>{{ errorMessage }}</p>
                  </hlm-alert>
                }
                @if (successMessage) {
                  <hlm-alert class="border-green-200 bg-green-50 text-green-900 mb-3">
                    <h4 hlmAlertTitle>Order Placed</h4>

                    <p hlmAlertDescription>{{ successMessage }}</p>
                  </hlm-alert>
                }
                <div class="space-y-3">
                  <div class="flex items-center justify-between text-sm text-gray-500">
                    <span>Subtotal</span>

                    <span> ৳ {{ cartTotal.toFixed(2) }} </span>
                  </div>

                  <div class="border-t border-gray-100 pt-4">
                    <div class="flex items-center justify-between">
                      <span class="text-base font-semibold text-gray-900"> Total </span>

                      <span class="text-xl font-bold text-gray-900">
                        ৳ {{ cartTotal.toFixed(2) }}
                      </span>
                    </div>
                  </div>

                  <button
                    type="button"
                    [disabled]="cartLength === 0"
                    (click)="checkout()"
                    class="mt-4 w-full rounded-xl cursor-pointer bg-gray-900 px-5 py-3 font-semibold text-white transition hover:bg-black disabled:cursor-not-allowed disabled:bg-gray-200 disabled:text-gray-400"
                  >
                    Checkout
                  </button>
                </div>
              </div>
            </div>
